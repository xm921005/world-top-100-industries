name: Update Top 100 Industries

on:
  schedule:
    # 每 30 分钟触发一次（UTC）。GitHub 实际执行可能有数分钟延迟，属平台正常现象。
    - cron: '*/30 * * * *'
  workflow_dispatch:  # 允许在 Actions 页面手动触发

permissions:
  contents: write

concurrency:
  group: ranking-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ranking updater
        run: python update.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git add -A
            git commit -m "chore: auto-update industry ranking $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
